[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "passgenerator"
version = "1.2.0"
description = "A secure password generator with a CLI utility"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Zackary Loether", email = "zloether@gmail.com" }]
keywords = ["password", "generator"]
requires-python = ">=3.11"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: Utilities",
    "Development Status :: 5 - Production/Stable",
]

[project.urls]
Homepage = "https://github.com/zloether/PassGenerator"
Issues = "https://github.com/zloether/PassGenerator/issues"

[project.scripts]
passgenerator = "passgenerator.passgenerator:__run_main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.8"]

[tool.setuptools]
packages = ["passgenerator"]

[tool.setuptools.package-data]
passgenerator = ["dictionary/*.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
